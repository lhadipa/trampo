# Blueprint do Render (plano free) para a API.
# A API e o banco PostgreSQL são executados/configurados pelo Render.
services:
  - type: web
    name: trampo-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # colar a connection string do PostgreSQL do Render no painel
      - key: ALLOWED_ORIGINS
        sync: false # ex.: https://trampo.vercel.app
