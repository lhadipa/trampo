services:
  postgres:
    image: postgres:16-alpine
    container_name: trampo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trampo
      POSTGRES_USER: trampo
      POSTGRES_PASSWORD: trampo_local_dev
    ports:
      - "55433:5432"
    volumes:
      - trampo_postgres_data:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  api:
    image: node:22-alpine
    container_name: trampo-api
    working_dir: /app
    command: sh -c "npm install && node server/index.js"
    environment:
      PORT: 3001
      DATABASE_URL: postgres://trampo:trampo_local_dev@postgres:5432/trampo
      JWT_SECRET: trampo_local_jwt_dev_change_me
    ports:
      - "3001:3001"
    volumes:
      - .:/app
    depends_on:
      - postgres

volumes:
  trampo_postgres_data:
